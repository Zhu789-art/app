<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>我的图文资料库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding-top: env(safe-area-inset-top); 
        }
        .scroll-x { display: flex; overflow-x: auto; white-space: nowrap; gap: 0.5rem; padding: 0.25rem 1rem; }
        .tab-item { padding: 0.4rem 0.8rem; border-radius: 9999px; font-weight: 500; font-size: 0.85rem; transition: all 0.2s; background-color: #e2e8f0; color: #475569; flex-shrink: 0; display: flex; align-items: center; gap: 4px;}
        .tab-item.active { background-color: #0d9488; color: white; box-shadow: 0 2px 4px rgba(13, 148, 136, 0.3); }
        mark { background-color: #fef08a; color: #b45309; padding: 0 2px; border-radius: 2px; font-weight: bold; }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-sm shrink-0 pt-3 z-20 sticky top-0 flex flex-col gap-2">
        <div class="flex justify-between items-center px-4">
            <h1 class="text-xl font-bold text-teal-700">图文资料库</h1>
            <div class="flex gap-2">
                <button onclick="toggleSearch()" class="p-2 bg-teal-50 text-teal-600 rounded-full active:bg-teal-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </button>
                <button onclick="openBoardModal()" class="p-2 bg-teal-50 text-teal-600 rounded-full active:bg-teal-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                </button>
                <button onclick="document.getElementById('modal-settings').classList.remove('hidden')" class="p-2 bg-gray-100 text-gray-600 rounded-full active:bg-gray-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>
        <div id="search-container" class="px-4 hidden pb-2">
            <div class="relative">
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜索文字内容..." class="w-full bg-gray-100 border border-gray-200 rounded-xl py-2 pl-10 pr-8 outline-none focus:border-teal-500 text-sm">
                <svg class="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <button onclick="clearSearch()" class="absolute right-2 top-2 text-gray-400 p-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>
        <div class="scroll-x pb-2 border-b border-gray-100" id="tab-bar"></div>
    </header>

    <div class="flex-1 overflow-y-auto p-4 pb-24" id="record-list"></div>

    <button onclick="openEditModal()" class="fixed bottom-8 right-6 bg-teal-600 text-white rounded-full p-4 shadow-xl z-40 flex items-center justify-center active:scale-95 transition">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>

    <div id="modal-edit" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex flex-col justify-end transition-opacity">
        <div class="bg-white w-full h-[90vh] rounded-t-3xl p-5 flex flex-col transform translate-y-full transition-transform duration-300" id="modal-content">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 id="modal-title" class="text-xl font-bold text-gray-800">添加内容</h2>
                <button onclick="closeEditModal()" class="p-2 bg-gray-100 rounded-full text-gray-500">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto no-scrollbar pb-4">
                <div class="w-full h-64 bg-gray-50 rounded-2xl mb-4 flex flex-col items-center justify-center overflow-hidden relative border-2 border-dashed border-gray-300 cursor-pointer" onclick="document.getElementById('image-input').click()">
                    < img id="image-preview" class="w-full h-full object-contain hidden" />
                    <div id="upload-placeholder" class="text-center text-gray-400">
                        <svg class="w-10 h-10 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span>点击拍照或从相册选择</span>
                    </div>
                    <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                </div>
                <textarea id="input-text" placeholder="记录学习笔记、想法或配文..." rows="6" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-4 outline-none focus:border-teal-500 text-gray-700 resize-none mb-4"></textarea>
            </div>
            <div class="flex gap-2 shrink-0 pt-2 border-t border-gray-100">
                <button id="btn-delete" onclick="deleteRecord()" class="flex-1 py-3 rounded-xl bg-red-50 text-red-600 font-bold hidden">删除</button>
                <button onclick="closeEditModal()" class="flex-1 py-3 rounded-xl bg-gray-100 font-bold text-gray-600">取消</button>
                <button onclick="saveRecord()" class="flex-[2] py-3 rounded-xl bg-teal-600 text-white font-bold shadow-md active:bg-teal-700">保存</button>
            </div>
        </div>
    </div>

    <div id="modal-board" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 h-[80vh] flex flex-col">
            <h2 class="text-xl font-bold mb-4 text-center shrink-0">管理板块</h2>
            <div class="bg-gray-50 p-3 rounded-xl mb-4 shrink-0 border border-gray-200">
                <div class="flex gap-2 mb-2">
                    <input type="text" id="new-board-name" placeholder="输入板块名称 (如: 会计学)" class="flex-1 bg-white border border-gray-300 rounded-lg p-2 outline-none focus:border-teal-500 text-sm">
                </div>
                <button onclick="addBoard()" class="w-full py-2 bg-teal-600 text-white font-bold rounded-lg active:bg-teal-700 text-sm">创建新板块</button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-2 mb-4" id="board-list"></div>
            <button onclick="document.getElementById('modal-board').classList.add('hidden')" class="w-full py-3 rounded-xl bg-gray-200 font-bold text-gray-700 shrink-0 text-sm">完成</button>
        </div>
    </div>

    <div id="modal-settings" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6">
            <h2 class="text-xl font-bold mb-2 text-center">数据备份</h2>
            <p class="text-xs text-center text-teal-600 font-bold mb-6 bg-teal-50 p-2 rounded-lg">当前已开启超大容量仓库支持</p >
            <div class="space-y-3 mb-6">
                <button onclick="exportData()" class="w-full py-3 rounded-xl bg-teal-100 text-teal-700 font-bold active:bg-teal-200">导出全部数据</button>
                <button onclick="triggerImport()" class="w-full py-3 rounded-xl bg-white border border-teal-500 text-teal-600 font-bold active:bg-teal-50">导入备份数据</button>
                <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
            </div>
            <button onclick="document.getElementById('modal-settings').classList.add('hidden')" class="w-full py-3 rounded-xl bg-gray-100 font-bold text-gray-700">关闭</button>
        </div>
    </div>
    <script>
        const DB_NAME = 'MyLibraryDB';
        const STORE_NAME = 'libraryStore';
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = e => reject(e);
                request.onsuccess = e => { db = e.target.result; resolve(); };
                request.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
                };
            });
        }

        function getDBData() {
            return new Promise((resolve, reject) => {
                if (!db) return resolve(null);
                const transaction = db.transaction([STORE_NAME], "readonly");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get("appData");
                request.onsuccess = () => resolve(request.result);
                request.onerror = e => reject(e);
            });
        }

        function setDBData(data) {
            return new Promise((resolve, reject) => {
                if (!db) return reject("DB not initialized");
                const transaction = db.transaction([STORE_NAME], "readwrite");
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put(data, "appData");
                request.onsuccess = () => resolve();
                request.onerror = e => reject(e);
            });
        }

        let appData = { boards: [{ id: 'b1', name: '会计学' }, { id: 'b2', name: '美食记录' }], records: [] };
        let currentBoardId = 'b1';
        let editingRecordId = null;
        let currentBase64Image = '';
        let searchQuery = '';

        async function loadData() {
            try {
                await initDB();
                let savedData = await getDBData();
                if (savedData) appData = savedData;
            } catch (e) { console.error("DB Error:", e); }
            if(appData.boards.length === 0) appData.boards = [{ id: 'b1', name: '默认板块' }];
            if(!appData.boards.find(b => b.id === currentBoardId)) currentBoardId = appData.boards[0].id;
            renderAll();
        }

        async function saveData() {
            renderAll();
            try { await setDBData(appData); } catch (e) { alert('保存到数据库失败！' + e); }
        }

        function renderTabs() {
            document.getElementById('tab-bar').innerHTML = appData.boards.map(b => `
                <div onclick="switchBoard('${b.id}')" class="tab-item ${b.id === currentBoardId ? 'active' : ''}">${b.name}</div>
            `).join('');
        }

        function switchBoard(id) {
            currentBoardId = id;
            if (searchQuery) clearSearch();
            renderTabs();
            renderList();
        }

        function toggleSearch() {
            const container = document.getElementById('search-container');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                document.getElementById('search-input').focus();
            } else { clearSearch(); }
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            searchQuery = '';
            document.getElementById('search-container').classList.add('hidden');
            renderList();
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value.trim();
            renderList();
        }

        function highlightText(text, query) {
            if (!query) return text;
            const escapeReg = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp(`(${escapeReg})`, 'gi'), '<mark>$1</mark>');
        }

        function renderList() {
            const listEl = document.getElementById('record-list');
            let displayRecords = searchQuery ? appData.records : appData.records.filter(r => r.boardId === currentBoardId);

            if (searchQuery) {
                const lowerQuery = searchQuery.toLowerCase();
                displayRecords = displayRecords.filter(r => r.text && r.text.toLowerCase().includes(lowerQuery));
            }

            const sorted = [...displayRecords].sort((a, b) => b.id - a.id);

            if (sorted.length === 0) {
                let msg = searchQuery ? `没有找到包含“${searchQuery}”的内容` : '这个板块还是空的，点右下角+添加吧！';
                listEl.innerHTML = `<div class="text-center text-gray-400 mt-20"><div class="text-6xl mb-4">📂</div><div>${msg}</div></div>`;
                return;
            }

            listEl.innerHTML = sorted.map(item => {
                const displayText = searchQuery ? highlightText(item.text, searchQuery) : item.text;
                const board = appData.boards.find(b => b.id === item.boardId);
                const boardTag = (searchQuery && board) ? `<span class="bg-teal-50 text-teal-600 text-xs px-2 py-0.5 rounded-full mb-2 inline-block font-bold">${board.name}</span>` : '';

                return `
                <div onclick="openEditModal(${item.id})" class="bg-white rounded-2xl shadow-sm mb-4 overflow-hidden cursor-pointer active:scale-[0.98] transition-transform border border-gray-100">
                    ${item.image ? `<div class="w-full bg-gray-50 flex justify-center">< img src="${item.image}" class="w-full h-auto max-h-[60vh] object-contain" loading="lazy"></div>` : ''}
                    <div class="p-4">
                        ${boardTag}
                        <p class="text-gray-800 text-[15px] leading-relaxed whitespace-pre-wrap">${displayText || '无文字描述'}</p >
                    </div>
                </div>`;
            }).join('');
        }

        function renderAll() { renderTabs(); renderList(); }

        function openBoardModal() { renderBoardManager(); document.getElementById('modal-board').classList.remove('hidden'); }

        function renderBoardManager() {
            document.getElementById('board-list').innerHTML = appData.boards.map(b => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <span class="font-bold text-gray-700">${b.name}</span>
                    ${appData.boards.length === 1 ? '<span class="text-xs text-gray-400">至少保留一个</span>' : `<button onclick="deleteBoard('${b.id}')" class="text-red-500 text-xs px-2 py-1 bg-red-50 rounded">删除</button>`}
                </div>
            `).join('');
        }

        function addBoard() {
            const input = document.getElementById('new-board-name');
            const name = input.value.trim();
            if (!name) { alert('请输入板块名称'); return; }
            if (appData.boards.find(b => b.name === name)) { alert('该名称已存在'); return; }
            const newId = 'b_' + Date.now();
            appData.boards.push({ id: newId, name: name });
            saveData(); input.value = ''; switchBoard(newId); renderBoardManager();
        }

        function deleteBoard(id) {
            if (appData.boards.length === 1) return;
            if (confirm('删除该板块会连同里面的所有图文一起删掉！确定吗？')) {
                appData.boards = appData.boards.filter(b => b.id !== id);
                appData.records = appData.records.filter(r => r.boardId !== id);
                if (currentBoardId === id) currentBoardId = appData.boards[0].id;
                saveData(); renderBoardManager();
            }
        }

        function openEditModal(id = null) {
            editingRecordId = id;
            const titleEl = document.getElementById('modal-title');
            const deleteBtn = document.getElementById('btn-delete');
            const imgPreview = document.getElementById('image-preview');
            const placeholder = document.getElementById('upload-placeholder');
            const textInput = document.getElementById('input-text');
            
            if (id) {
                const item = appData.records.find(r => r.id === id);
                titleEl.innerText = '编辑内容'; deleteBtn.classList.remove('hidden'); textInput.value = item.text;
                if (item.image) {
                    currentBase64Image = item.image; imgPreview.src = item.image; imgPreview.classList.remove('hidden'); placeholder.classList.add('hidden');
                } else { clearImage(); }
            } else {
                titleEl.innerText = '添加内容'; deleteBtn.classList.add('hidden'); textInput.value = ''; clearImage();
            }
            
            const modal = document.getElementById('modal-edit'), content = document.getElementById('modal-content');
            modal.classList.remove('hidden'); void modal.offsetWidth; content.classList.remove('translate-y-full');
        }

        function clearImage() {
            currentBase64Image = '';
            document.getElementById('image-preview').src = '';
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            document.getElementById('image-input').value = '';
        }

        function closeEditModal() {
            const modal = document.getElementById('modal-edit'), content = document.getElementById('modal-content');
            content.classList.add('translate-y-full'); setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function handleImageSelect(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height; const maxSize = 1200; 
                    if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; } 
                    else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    currentBase64Image = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('image-preview').src = currentBase64Image;
                    document.getElementById('image-preview').classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function saveRecord() {
            const text = document.getElementById('input-text').value.trim();
            if (!text && !currentBase64Image) { alert('请输入文字或上传图片！'); return; }
            if (editingRecordId) {
                const item = appData.records.find(r => r.id === editingRecordId);
                if (item) { item.text = text; item.image = currentBase64Image; }
            } else {
                appData.records.push({ id: Date.now(), boardId: currentBoardId, text: text, image: currentBase64Image });
            }
            saveData(); closeEditModal(); if (searchQuery) handleSearch(); 
        }

        function deleteRecord() {
            if (!editingRecordId) return;
            if (confirm('确定要删除这条内容吗？')) { 
                appData.records = appData.records.filter(r => r.id !== editingRecordId); 
                saveData(); closeEditModal(); if (searchQuery) handleSearch();
            }
        }

        function exportData() {
            if (appData.records.length === 0) { alert('没有内容可备份'); return; }
            const dataStr = JSON.stringify(appData);
            const blob = new Blob([dataStr], { type: "application/json" });
            const date = new Date();
            const fileName = `图文资料库备份-${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}.json`;
            if (navigator.canShare && navigator.canShare({ files: [new File([blob], fileName, { type: "application/json" })] })) {
                navigator.share({ files: [new File([blob], fileName, { type: "application/json" })], title: '资料库备份' }).catch(err => { if (err.name !== 'AbortError') downloadBlob(blob, fileName); });
            } else { downloadBlob(blob, fileName); }
        }

        function downloadBlob(blob, fileName) {
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100); alert('备份文件已下载。');
        }

        function triggerImport() { document.getElementById('import-file').click(); }

        function importData(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.boards && parsed.records) {
                        if (confirm('导入将覆盖当前所有数据，确定吗？')) { appData = parsed; await saveData(); alert('数据恢复成功！'); document.getElementById('modal-settings').classList.add('hidden'); }
                    } else { alert('文件格式错误！'); }
                } catch (err) { alert('读取文件失败！'); }
            };
            reader.readAsText(file); event.target.value = '';
        }

        loadData();
    </script>
</body>
</html>
