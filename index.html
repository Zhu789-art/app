<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>我的图文资料库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        body { -webkit-tap-highlight-color: transparent; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding-top: env(safe-area-inset-top); }
        .scroll-x { display: flex; overflow-x: auto; white-space: nowrap; gap: 0.5rem; padding: 0.25rem 1rem; }
        .tab-item { padding: 0.4rem 0.8rem; border-radius: 9999px; font-weight: 500; font-size: 0.85rem; background-color: #e2e8f0; color: #475569; flex-shrink: 0; }
        .tab-item.active { background-color: #0d9488; color: white; }
        mark { background-color: #fef08a; color: #b45309; padding: 0 2px; border-radius: 2px; }
        
        .grid-item { aspect-ratio: 1 / 1; border-radius: 0.5rem; overflow: hidden; position: relative; background-color: #e2e8f0; display: flex; align-items: center; justify-content: center; border: 1px solid #f1f5f9; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }
        .grid-text-fallback { font-size: 1.2rem; font-weight: bold; color: #64748b; padding: 4px; text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        input[type="date"] { -webkit-appearance: none; appearance: none; background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-800">
    <header class="bg-white shadow-sm shrink-0 pt-3 z-20 sticky top-0 flex flex-col gap-2">
        <div class="flex justify-between items-center px-4">
            <h1 class="text-xl font-bold text-teal-700">图文资料库</h1>
            <div class="flex gap-2">
                <button onclick="toggleView()" class="p-2 bg-teal-50 text-teal-600 rounded-full">
                    <svg id="icon-grid" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    <svg id="icon-list" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                
                <button onclick="toggleSearch()" class="p-2 bg-teal-50 text-teal-600 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
                <button onclick="openBoardModal()" class="p-2 bg-teal-50 text-teal-600 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg></button>
                <button onclick="document.getElementById('modal-settings').classList.remove('hidden')" class="p-2 bg-gray-100 text-gray-600 rounded-full"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
            </div>
        </div>
        <div id="search-container" class="px-4 hidden pb-2">
            <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜索文字..." class="w-full bg-gray-100 rounded-xl py-2 px-3 text-sm outline-none">
        </div>
        <div class="scroll-x pb-2 border-b border-gray-100" id="tab-bar"></div>
    </header>

    <div class="flex-1 overflow-y-auto p-4 pb-24" id="record-list"></div>

    <button onclick="openEditModal()" class="fixed bottom-8 right-6 bg-teal-600 text-white rounded-full p-4 shadow-xl z-40"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg></button>

    <!-- 弹窗 -->
    <div id="modal-edit" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex flex-col justify-end">
        <div class="bg-white w-full h-[90vh] rounded-t-3xl p-5 flex flex-col">
            <div class="flex justify-between items-center mb-4"><h2 id="modal-title" class="text-xl font-bold">添加内容</h2><button onclick="closeEditModal()" class="text-gray-500">关闭</button></div>
            <div class="flex-1 overflow-y-auto">
                <div class="w-full h-64 bg-gray-50 rounded-2xl mb-4 flex items-center justify-center overflow-hidden border-2 border-dashed cursor-pointer" onclick="document.getElementById('image-input').click()">
                    <img id="image-preview" class="w-full h-full object-contain hidden" />
                    <span id="upload-placeholder" class="text-gray-400">点击传图</span>
                    <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                </div>
                
                <!-- 新增：日期选择器 -->
                <div class="mb-4 flex items-center bg-gray-50 rounded-xl px-4 py-3 border border-gray-100">
                    <span class="text-gray-500 text-sm mr-2 shrink-0">日期：</span>
                    <input type="date" id="input-date" class="bg-transparent text-teal-700 font-bold outline-none flex-1">
                </div>

                <textarea id="input-text" placeholder="写点什么..." rows="5" class="w-full bg-gray-50 rounded-xl p-4 outline-none mb-4"></textarea>
            </div>
            <div class="flex gap-2"><button id="btn-delete" onclick="deleteRecord()" class="flex-1 py-3 bg-red-50 text-red-600 rounded-xl hidden font-bold">删除</button><button onclick="saveRecord()" class="flex-[2] py-3 bg-teal-600 text-white rounded-xl font-bold">保存</button></div>
        </div>
    </div>

    <div id="modal-board" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 h-[80vh] flex flex-col">
            <h2 class="text-xl font-bold mb-4 text-center">管理板块</h2>
            <div class="flex gap-2 mb-4"><input type="text" id="new-board-name" placeholder="板块名称" class="flex-1 border rounded-lg p-2"><button onclick="addBoard()" class="bg-teal-600 text-white px-4 rounded-lg">添加</button></div>
            <div class="flex-1 overflow-y-auto space-y-2 mb-4" id="board-list"></div>
            <button onclick="document.getElementById('modal-board').classList.add('hidden')" class="w-full py-3 bg-gray-200 rounded-xl font-bold">完成</button>
        </div>
    </div>

    <div id="modal-settings" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6">
            <h2 class="text-xl font-bold mb-6 text-center">数据备份</h2>
            <div class="space-y-3 mb-6"><button onclick="exportData()" class="w-full py-3 bg-teal-100 text-teal-700 rounded-xl font-bold">导出数据</button><button onclick="triggerImport()" class="w-full py-3 border border-teal-500 text-teal-600 rounded-xl font-bold">导入数据</button><input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)"></div>
            <button onclick="document.getElementById('modal-settings').classList.add('hidden')" class="w-full py-3 bg-gray-100 rounded-xl font-bold">关闭</button>
        </div>
    </div>

    <script>
        let appData = { boards: [{ id: 'b1', name: '默认板块' }], records: [] };
        let currentBoardId = 'b1', editingRecordId = null, currentBase64Image = '', searchQuery = '';
        let currentView = 'list'; 

        function loadData() {
            const saved = localStorage.getItem('library_data'); 
            if (saved) {
                appData = JSON.parse(saved);
                // 兼容旧数据：如果没有 date 字段，把 id(时间戳) 转换过来
                if (appData.records) {
                    appData.records.forEach(r => {
                        if (!r.date) {
                            const d = new Date(r.id);
                            r.date = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        }
                    });
                }
            }
            if(appData.boards.length === 0) appData.boards = [{ id: 'b1', name: '默认板块' }];
            if(!appData.boards.find(b => b.id === currentBoardId)) currentBoardId = appData.boards[0].id;
            renderAll();
        }

        function saveData() {
            try { localStorage.setItem('library_data', JSON.stringify(appData)); renderAll(); } 
            catch (e) { alert('空间满了！请导出备份后，删掉一些旧照片。'); }
        }

        function toggleView() {
            currentView = currentView === 'list' ? 'grid' : 'list';
            document.getElementById('icon-grid').classList.toggle('hidden', currentView === 'grid');
            document.getElementById('icon-list').classList.toggle('hidden', currentView === 'list');
            renderList();
        }

        function renderTabs() {
            document.getElementById('tab-bar').innerHTML = appData.boards.map(b => `<div onclick="switchBoard('${b.id}')" class="tab-item ${b.id === currentBoardId ? 'active' : ''}">${b.name}</div>`).join('');
        }

        function switchBoard(id) { currentBoardId = id; if (searchQuery) clearSearch(); renderTabs(); renderList(); }
        function toggleSearch() { const c = document.getElementById('search-container'); if (c.classList.contains('hidden')) { c.classList.remove('hidden'); document.getElementById('search-input').focus(); } else { clearSearch(); } }
        function clearSearch() { document.getElementById('search-input').value = ''; searchQuery = ''; document.getElementById('search-container').classList.add('hidden'); renderList(); }
        function handleSearch() { searchQuery = document.getElementById('search-input').value.trim(); renderList(); }
        function highlightText(text, query) { if (!query) return text; return text.replace(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi'), '<mark>$1</mark>'); }

        // 根据传入的日期字符串(YYYY-MM-DD) 获取月份名称
        function getMonthName(dateStr) {
            if (!dateStr) return "未知时间";
            const parts = dateStr.split('-');
            return `${parts[0]}年${parseInt(parts[1])}月`;
        }

        function renderList() {
            const listEl = document.getElementById('record-list');
            let displayRecords = searchQuery ? appData.records : appData.records.filter(r => r.boardId === currentBoardId);
            if (searchQuery) { const q = searchQuery.toLowerCase(); displayRecords = displayRecords.filter(r => r.text && r.text.toLowerCase().includes(q)); }
            
            // 排序逻辑：优先按照日期(date)倒序，如果日期一样，再按照 id 倒序
            const sorted = [...displayRecords].sort((a, b) => {
                const dateA = a.date || '';
                const dateB = b.date || '';
                if (dateA !== dateB) return dateB.localeCompare(dateA);
                return b.id - a.id;
            });
            
            if (sorted.length === 0) { 
                listEl.innerHTML = `<div class="text-center text-gray-400 mt-20"><div class="text-6xl mb-4">📂</div><div>${searchQuery ? '没有找到内容' : '空的，点右下角+添加吧！'}</div></div>`; 
                return; 
            }

            if (currentView === 'list') {
                listEl.innerHTML = sorted.map(item => {
                    const text = searchQuery ? highlightText(item.text, searchQuery) : item.text;
                    const board = appData.boards.find(b => b.id === item.boardId);
                    const tag = (searchQuery && board) ? `<span class="text-xs bg-teal-50 text-teal-600 px-2 py-0.5 rounded mb-2 inline-block font-bold">${board.name}</span>` : '';
                    return `<div onclick="openEditModal(${item.id})" class="bg-white rounded-2xl shadow-sm mb-4 overflow-hidden active:scale-[0.98] transition-transform">${item.image ? `<div class="w-full bg-gray-50 flex justify-center"><img src="${item.image}" class="w-full max-h-[60vh] object-contain"></div>` : ''}<div class="p-4">${tag}<p class="text-gray-800 text-[15px] leading-relaxed whitespace-pre-wrap">${text || '无描述'}</p><p class="text-xs text-gray-400 mt-2 font-medium">${item.date || ''}</p></div></div>`;
                }).join('');
            } else {
                // 相册视图按传入的日期分组
                const groupedByMonth = {};
                sorted.forEach(item => {
                    const month = getMonthName(item.date);
                    if (!groupedByMonth[month]) groupedByMonth[month] = [];
                    groupedByMonth[month].push(item);
                });

                let html = '';
                for (let month in groupedByMonth) {
                    html += `<div class="mb-4"><h3 class="text-sm font-bold text-gray-500 mb-2 px-1">${month}</h3>`;
                    html += `<div class="grid grid-cols-3 gap-1.5">`;
                    
                    groupedByMonth[month].forEach(item => {
                        if (item.image) {
                            html += `<div onclick="openEditModal(${item.id})" class="grid-item cursor-pointer active:scale-95 transition-transform"><img src="${item.image}" loading="lazy"></div>`;
                        } else {
                            const displayStr = item.text ? item.text.substring(0, 10) : '记';
                            html += `<div onclick="openEditModal(${item.id})" class="grid-item bg-teal-50 cursor-pointer active:scale-95 transition-transform"><span class="grid-text-fallback">${displayStr}</span></div>`;
                        }
                    });
                    
                    html += `</div></div>`;
                }
                listEl.innerHTML = html;
            }
        }

        function renderAll() { renderTabs(); renderList(); }
        function openBoardModal() { renderBoardManager(); document.getElementById('modal-board').classList.remove('hidden'); }
        function renderBoardManager() { document.getElementById('board-list').innerHTML = appData.boards.map(b => `<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl"><span class="font-bold">${b.name}</span>${appData.boards.length === 1 ? '' : `<button onclick="deleteBoard('${b.id}')" class="text-red-500 text-xs bg-red-50 px-2 py-1 rounded">删除</button>`}</div>`).join(''); }
        function addBoard() { const input = document.getElementById('new-board-name'); const name = input.value.trim(); if (!name) return; if (appData.boards.find(b => b.name === name)) { alert('名字重复'); return; } const newId = 'b_' + Date.now(); appData.boards.push({ id: newId, name }); saveData(); input.value = ''; switchBoard(newId); renderBoardManager(); }
        function deleteBoard(id) { if (appData.boards.length === 1) return; if (confirm('删板块会删掉里面的内容，确定吗？')) { appData.boards = appData.boards.filter(b => b.id !== id); appData.records = appData.records.filter(r => r.boardId !== id); if (currentBoardId === id) currentBoardId = appData.boards[0].id; saveData(); renderBoardManager(); } }

        function openEditModal(id = null) {
            editingRecordId = id;
            const dateInput = document.getElementById('input-date');
            document.getElementById('modal-title').innerText = id ? '编辑内容' : '添加内容';
            document.getElementById('btn-delete').style.display = id ? 'block' : 'none';
            
            if (id) { 
                const record = appData.records.find(r => r.id === id);
                document.getElementById('input-text').value = record.text || '';
                dateInput.value = record.date;
                if(record.image) { 
                    currentBase64Image = record.image; 
                    document.getElementById('image-preview').src = record.image; 
                    document.getElementById('image-preview').classList.remove('hidden'); 
                    document.getElementById('upload-placeholder').classList.add('hidden'); 
                } else {
                    currentBase64Image = ''; 
                    document.getElementById('image-preview').src = ''; 
                    document.getElementById('image-preview').classList.add('hidden'); 
                    document.getElementById('upload-placeholder').classList.remove('hidden'); 
                }
            } else { 
                currentBase64Image = ''; 
                document.getElementById('input-text').value = '';
                document.getElementById('image-preview').src = ''; 
                document.getElementById('image-preview').classList.add('hidden'); 
                document.getElementById('upload-placeholder').classList.remove('hidden'); 
                
                // 默认填入今天
                const now = new Date();
                dateInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            }
            document.getElementById('modal-edit').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('modal-edit').classList.add('hidden'); }

        function handleImageSelect(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    const maxSize = 600; 
                    if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; } else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    currentBase64Image = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('image-preview').src = currentBase64Image;
                    document.getElementById('image-preview').classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function saveRecord() {
            const text = document.getElementById('input-text').value.trim();
            const dateVal = document.getElementById('input-date').value;
            
            if (!dateVal) { alert('请选择日期'); return; }
            if (!text && !currentBase64Image) { alert('写点字或传张图吧！'); return; }
            
            if (editingRecordId) { 
                const item = appData.records.find(r => r.id === editingRecordId); 
                item.text = text; 
                item.image = currentBase64Image;
                item.date = dateVal; 
            } else { 
                appData.records.push({ id: Date.now(), boardId: currentBoardId, text, image: currentBase64Image, date: dateVal }); 
            }
            saveData(); closeEditModal();
        }

        function deleteRecord() { if (!editingRecordId) return; if (confirm('删除这条内容？')) { appData.records = appData.records.filter(r => r.id !== editingRecordId); saveData(); closeEditModal(); } }

        function exportData() { if (appData.records.length === 0) return alert('没数据'); const blob = new Blob([JSON.stringify(appData)], { type: "application/json" }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `备份.json`; a.click(); }
        function triggerImport() { document.getElementById('import-file').click(); }
        function importData(event) { const file = event.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = function(e) { try { const parsed = JSON.parse(e.target.result); if (parsed.boards && parsed.records && confirm('导入会覆盖当前数据，确定吗？')) { appData = parsed; saveData(); alert('恢复成功！'); document.getElementById('modal-settings').classList.add('hidden'); } } catch (err) { alert('文件错误'); } }; reader.readAsText(file); event.target.value = ''; }

        loadData();
    </script>
</body>
</html>
